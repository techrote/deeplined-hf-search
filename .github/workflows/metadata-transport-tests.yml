name: Metadata gateway tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/network-transport-test.cjs tests/gateway-test.mjs
      - run: node --test tests/model-inspector-test.cjs
      - run: node tests/phase5-test.js
      - run: node tests/regex-search-test.cjs
      - run: node tests/benchmarks-themes-test.cjs
      - run: node tests/leaderboard-test.cjs
